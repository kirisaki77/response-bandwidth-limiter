name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.10'
          - '3.14'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements/dev.txt -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  minimum-starlette:
    name: Minimum Starlette (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime with minimum supported Starlette
        run: python -m pip install . "starlette==0.20.0"

      - name: Validate dependencies
        run: python -m pip check

      - name: Exercise minimum-version public API
        run: python -I tests/test_starlette_compatibility.py -v

  redis-integration:
    name: Redis integration (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements/dev.txt -e ".[dev]"

      - name: Run Redis storage and integration tests
        run: python -m pytest -q tests/test_redis_storage.py

  build:
    name: Build verification (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned build tooling
        run: python -m pip install -r requirements/dev.txt

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test installed wheel in a clean environment
        run: python scripts/verify_wheel.py dist
